<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="version" content="2026-07-29-v2">
  <title>System Info - Hansoll Gallery Archive</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Google Fonts & Pretendard -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

    body {
      font-family: 'Pretendard', 'Inter', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }

    /* Custom Scrollbar */
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* Animations */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes modalPop {
      from {
        opacity: 0;
        transform: scale(0.96) translateY(10px);
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .animate-fade-in {
      animation: fadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .animate-modal {
      animation: modalPop 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              200: '#bfdbfe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#1e3a8a',
            }
          }
        }
      }
    }
  </script>
</head>

<body class="bg-[#f8fafc] text-slate-800 min-h-screen flex flex-col custom-scrollbar">

  <!-- ==================== TOP HEADER ==================== -->
  <header class="bg-white border-b border-slate-200/80 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between gap-4">
      <!-- Title Area -->
      <div class="flex items-center gap-3.5 min-w-0">
        <div
          class="flex h-12 w-12 shrink-0 items-center justify-center rounded-2xl bg-gradient-to-tr from-brand-600 to-indigo-500 text-white shadow-md shadow-brand-500/20">
          <i data-lucide="folder-kanban" class="h-6 w-6"></i>
        </div>
        <div>
          <h1 class="text-xl sm:text-2xl font-extrabold text-slate-900 tracking-tight truncate">
            Hansoll Gallery Archive
          </h1>
        </div>
      </div>

      <!-- Header Actions -->
      <div class="flex items-center gap-2 sm:gap-3">
        <!-- View Mode Toggle Buttons -->
        <div class="hidden sm:flex items-center bg-slate-100 p-1 rounded-xl border border-slate-200/60">
          <button id="view-mode-grid" onclick="setViewMode('grid')" title="카드 보기"
            class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-bold transition-all bg-white text-brand-600 shadow-sm">
            <i data-lucide="layout-grid" class="h-3.5 w-3.5"></i>
            <span>카드형</span>
          </button>
          <button id="view-mode-table" onclick="setViewMode('table')" title="리스트 보기"
            class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-bold transition-all text-slate-600 hover:text-slate-900">
            <i data-lucide="list" class="h-3.5 w-3.5"></i>
            <span>리스트형</span>
          </button>
        </div>

        <!-- Create New Material Button -->
        <button onclick="openFormModal()"
          class="flex items-center gap-2 px-4 py-2.5 bg-brand-600 hover:bg-brand-700 text-white text-sm font-bold rounded-xl shadow-md shadow-brand-600/25 hover:shadow-lg hover:shadow-brand-600/30 active:scale-[0.98] transition-all">
          <i data-lucide="plus" class="h-4 w-4"></i>
          <span>신규 자료 등록</span>
        </button>
      </div>
    </div>
  </header>

  <!-- ==================== MAIN SECTION ==================== -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 flex flex-col gap-6">

    <!-- SEARCH & CATEGORY FILTER BAR -->
    <div
      class="bg-white border border-slate-200/80 rounded-2xl p-4 sm:p-5 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-4">
      <!-- Category Tabs -->
      <div id="category-tabs" class="flex items-center gap-1.5 overflow-x-auto custom-scrollbar pb-1 md:pb-0">
        <!-- Rendered dynamically by JS -->
      </div>

      <!-- Search Input -->
      <div class="flex items-center gap-2 shrink-0">
        <!-- Search Box -->
        <div class="relative w-full sm:w-64">
          <i data-lucide="search" class="absolute left-3.5 top-1/2 -translate-y-1/2 h-4 w-4 text-slate-400"></i>
          <input type="text" id="search-input" oninput="handleSearchInput(event)" placeholder="제목, 내용, 작성자, 부서 검색..."
            class="w-full h-10 pl-9 pr-8 bg-slate-50 border border-slate-200 rounded-xl text-xs sm:text-sm font-medium outline-none focus:border-brand-500 focus:bg-white transition-all">
          <button id="btn-clear-search" onclick="clearSearch()"
            class="absolute right-2.5 top-1/2 -translate-y-1/2 h-5 w-5 rounded-full hover:bg-slate-200 text-slate-400 hover:text-slate-600 hidden items-center justify-center transition-colors">
            <i data-lucide="x" class="h-3 w-3"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- MATERIALS LIST / GRID CONTAINER -->
    <div id="materials-container" class="min-h-[640px] flex-1">
      <!-- Content rendered dynamically -->
    </div>
  </main>

  <!-- ==================== DETAIL VIEW MODAL ==================== -->
  <div id="detail-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 overflow-y-auto">
    <!-- Backdrop -->
    <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm transition-opacity" onclick="closeDetailModal()"></div>

    <!-- Modal Content -->
    <div
      class="relative w-full max-w-3xl bg-white rounded-3xl shadow-2xl border border-slate-200/80 overflow-hidden z-10 animate-modal my-8">
      <!-- Modal Header -->
      <div class="px-6 py-5 border-b border-slate-100 bg-slate-50/50 flex items-start justify-between gap-4">
        <div class="flex items-center flex-wrap gap-2.5 min-w-0">
          <span id="detail-category-badge" class="px-2.5 py-0.5 rounded-full text-xs font-bold shrink-0"></span>
          <h2 id="detail-title"
            class="text-xl sm:text-2xl font-extrabold text-slate-900 tracking-tight leading-snug break-keep"></h2>
        </div>
        <button onclick="closeDetailModal()"
          class="p-2 rounded-xl text-slate-400 hover:text-slate-700 hover:bg-slate-100 transition-colors shrink-0">
          <i data-lucide="x" class="h-5 w-5"></i>
        </button>
      </div>

      <!-- Modal Body -->
      <div class="p-6 sm:p-8 space-y-6 max-h-[70vh] overflow-y-auto custom-scrollbar">
        <!-- Author Profile Bar -->
        <div class="flex items-center justify-between p-3.5 bg-slate-50/80 rounded-2xl border border-slate-200/60">
          <div class="flex items-center gap-3">
            <div id="detail-author-avatar"
              class="w-10 h-10 rounded-full bg-brand-100 text-brand-600 font-extrabold flex items-center justify-center text-sm shadow-sm">
            </div>
            <div>
              <div id="detail-author-name" class="text-sm font-bold text-slate-800"></div>
            </div>
          </div>
          <div class="flex items-center gap-1.5 text-xs whitespace-nowrap">
            <span class="font-medium text-slate-400">등록일자 :</span>
            <span id="detail-date-display" class="font-mono font-bold text-slate-600"></span>
          </div>
        </div>

        <!-- Text Content -->
        <div>
          <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">상세 내용</h3>
          <div id="detail-content"
            class="text-sm sm:text-base text-slate-700 leading-relaxed whitespace-pre-wrap break-words bg-white p-4 rounded-2xl border border-slate-100">
          </div>
        </div>

        <!-- Attached Files Section -->
        <div id="detail-files-section">
          <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2.5 flex items-center gap-1.5">
            <i data-lucide="paperclip" class="h-4 w-4 text-brand-600"></i>
            <span>첨부 파일</span>
            <span id="detail-files-count"
              class="ml-1 px-2 py-0.5 bg-slate-100 text-slate-600 rounded-full text-[11px] font-extrabold">0</span>
          </h3>
          <div id="detail-files-list" class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
            <!-- Rendered by JS -->
          </div>
        </div>

        <!-- Reference URLs Section -->
        <div id="detail-urls-section">
          <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2.5 flex items-center gap-1.5">
            <i data-lucide="link-2" class="h-4 w-4 text-brand-600"></i>
            <span>참고 및 바로가기 URL</span>
            <span id="detail-urls-count"
              class="ml-1 px-2 py-0.5 bg-slate-100 text-slate-600 rounded-full text-[11px] font-extrabold">0</span>
          </h3>
          <div id="detail-urls-list" class="space-y-2">
            <!-- Rendered by JS -->
          </div>
        </div>
      </div>

      <!-- Modal Footer / Actions -->
      <div class="px-6 py-4 bg-slate-50 border-t border-slate-100 flex items-center justify-between gap-3">
        <div class="flex items-center gap-2">
          <button id="btn-detail-edit" onclick="editFromDetail()"
            class="flex items-center gap-1.5 px-4 py-2 bg-white hover:bg-slate-100 text-slate-700 border border-slate-300 font-bold text-xs sm:text-sm rounded-xl transition-all shadow-sm">
            <i data-lucide="edit-3" class="h-4 w-4 text-brand-600"></i>
            <span>수정</span>
          </button>
          <button id="btn-detail-delete" onclick="deleteFromDetail()"
            class="flex items-center gap-1.5 px-4 py-2 bg-white hover:bg-rose-50 text-rose-600 border border-rose-200 font-bold text-xs sm:text-sm rounded-xl transition-all shadow-sm">
            <i data-lucide="trash-2" class="h-4 w-4"></i>
            <span>삭제</span>
          </button>
        </div>
        <button onclick="closeDetailModal()"
          class="px-6 py-2 bg-slate-800 hover:bg-slate-900 text-white font-bold text-xs sm:text-sm rounded-xl transition-all shadow-md">
          닫기
        </button>
      </div>
    </div>
  </div>

  <!-- ==================== CREATE / EDIT FORM MODAL ==================== -->
  <div id="form-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 overflow-y-auto">
    <!-- Backdrop -->
    <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm transition-opacity" onclick="closeFormModal()"></div>

    <!-- Modal Content -->
    <div
      class="relative w-full max-w-2xl bg-white rounded-3xl shadow-2xl border border-slate-200/80 overflow-hidden z-10 animate-modal my-8">
      <!-- Modal Header -->
      <div class="px-6 py-5 border-b border-slate-100 bg-slate-50/50 flex items-center justify-between">
        <div class="flex items-center gap-2.5">
          <div id="form-header-icon"
            class="w-9 h-9 rounded-xl bg-brand-100 text-brand-600 flex items-center justify-center">
            <i data-lucide="plus-circle" class="h-5 w-5"></i>
          </div>
          <div>
            <h2 id="form-modal-title" class="text-lg font-extrabold text-slate-900">신규 자료 등록</h2>
            <p id="form-modal-desc" class="text-xs text-slate-500">필요한 정보를 입력하고 파일이나 참고 URL을 추가해주세요.</p>
          </div>
        </div>
        <button onclick="closeFormModal()"
          class="p-2 rounded-xl text-slate-400 hover:text-slate-700 hover:bg-slate-100 transition-colors">
          <i data-lucide="x" class="h-5 w-5"></i>
        </button>
      </div>

      <!-- Modal Body (Form) -->
      <form id="material-form" onsubmit="handleFormSubmit(event)"
        class="p-6 sm:p-8 space-y-5 max-h-[72vh] overflow-y-auto custom-scrollbar">
        <!-- Hidden fields for DB persistence (부서코드, 사번, 직급코드, 직급명) -->
        <input type="hidden" id="form-item-id" value="">
        <input type="hidden" id="form-cd-dept" value="">
        <input type="hidden" id="form-emp-no" value="">
        <input type="hidden" id="form-occp-cd" value="">
        <input type="hidden" id="form-occp-nm" value="">

        <!-- Row 1: 부서명 / 이름 (화면에는 필요한 항목만 표시, 코드는 DB 저장용으로 유지) -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <!-- Department Name (nm_dept) -->
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1.5 flex items-center justify-between">
              <span>부서명 <span class="text-rose-500">*</span></span>
              <span class="text-[10px] bg-slate-200/80 text-slate-600 px-1.5 py-0.5 rounded font-semibold">로그인</span>
            </label>
            <div class="relative">
              <i data-lucide="building-2" class="absolute left-3.5 top-1/2 -translate-y-1/2 h-4 w-4 text-slate-400"></i>
              <input type="text" id="form-department" readonly required
                class="w-full h-11 pl-10 pr-3 bg-slate-100 border border-slate-200/80 rounded-xl text-xs sm:text-sm font-bold text-slate-700 outline-none cursor-not-allowed select-none">
            </div>
          </div>

          <!-- Employee Name (emp_nm) -->
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1.5 flex items-center justify-between">
              <span>이름 <span class="text-rose-500">*</span></span>
              <span class="text-[10px] bg-slate-200/80 text-slate-600 px-1.5 py-0.5 rounded font-semibold">로그인</span>
            </label>
            <div class="relative">
              <i data-lucide="user" class="absolute left-3.5 top-1/2 -translate-y-1/2 h-4 w-4 text-slate-400"></i>
              <input type="text" id="form-author" readonly required
                class="w-full h-11 pl-10 pr-3 bg-slate-100 border border-slate-200/80 rounded-xl text-xs sm:text-sm font-bold text-slate-700 outline-none cursor-not-allowed select-none">
            </div>
          </div>
        </div>

        <!-- Row 2: 카테고리 (선택) & 제목 (입력) -->
        <div class="grid grid-cols-1 sm:grid-cols-4 gap-4">
          <!-- Category (1 col - 1/4 width) -->
          <div class="sm:col-span-1">
            <label class="block text-xs font-bold text-slate-700 mb-1.5">
              카테고리 <span class="text-rose-500">*</span>
            </label>
            <select id="form-category" required
              class="w-full h-11 px-3.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium outline-none focus:border-brand-500 focus:bg-white transition-all">
              <option value="참고 자료">참고 자료</option>
              <option value="교육 관련">교육 관련</option>
              <option value="기타">기타</option>
            </select>
          </div>

          <!-- Title (3 cols - 3/4 width) -->
          <div class="sm:col-span-3">
            <label class="block text-xs font-bold text-slate-700 mb-1.5">
              제목 <span class="text-rose-500">*</span>
            </label>
            <input type="text" id="form-title" required placeholder="자료의 직관적인 제목을 입력해주세요"
              class="w-full h-11 px-3.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium outline-none focus:border-brand-500 focus:bg-white transition-all">
          </div>
        </div>

        <!-- Content -->
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5">
            자료 설명 / 내용 <span class="text-rose-500">*</span>
          </label>
          <textarea id="form-content" required rows="4" placeholder="자료에 대한 간략한 설명이나 참고할 사항을 입력해주세요."
            class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium outline-none focus:border-brand-500 focus:bg-white transition-all custom-scrollbar"></textarea>
        </div>

        <!-- File Attachment Section -->
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label class="block text-xs font-bold text-slate-700">
              파일 첨부 (선택)
            </label>
            <span class="text-[11px] text-slate-400">다중 파일 선택 가능</span>
          </div>

          <!-- Drag and drop box -->
          <div id="file-drop-zone" onclick="document.getElementById('file-input').click()"
            ondragenter="handleDragEnter(event)" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event)"
            class="border-2 border-dashed border-slate-200 hover:border-brand-500 rounded-2xl p-5 text-center cursor-pointer bg-slate-50/50 hover:bg-brand-50/30 transition-all group">
            <input type="file" id="file-input" multiple class="hidden" onchange="handleFileSelect(event)">
            <div class="flex flex-col items-center gap-1.5 pointer-events-none">
              <div
                class="w-10 h-10 rounded-full bg-slate-100 group-hover:bg-brand-100 text-slate-500 group-hover:text-brand-600 flex items-center justify-center transition-colors">
                <i data-lucide="upload-cloud" class="w-5 h-5"></i>
              </div>
              <p class="text-xs font-bold text-slate-700 group-hover:text-brand-600 transition-colors">
                여기를 클릭하여 파일 선택 또는 드래그 앤 드롭
              </p>
              <p class="text-[11px] text-slate-400">PDF, Excel, Word, 이미지, PPT 등 (최대 50MB)</p>
            </div>
          </div>

          <!-- Selected Files List -->
          <div id="form-files-preview" class="mt-2.5 space-y-1.5">
            <!-- Rendered by JS -->
          </div>
        </div>

        <!-- URL Attachment Section -->
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label class="block text-xs font-bold text-slate-700">
              참고 URL 링크 (선택)
            </label>
            <button type="button" onclick="addUrlInputRow()"
              class="text-xs font-bold text-brand-600 hover:text-brand-700 flex items-center gap-1">
              <i data-lucide="plus" class="h-3.5 w-3.5"></i>
              <span>URL 추가</span>
            </button>
          </div>

          <div id="url-inputs-container" class="space-y-2">
            <!-- Rendered by JS -->
          </div>
        </div>

        <!-- Row 6: Password Input Section -->
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5 flex items-center justify-between">
            <span>비밀번호 (수정 · 삭제 시 필요) <span class="text-rose-500">*</span></span>
            <span class="text-[11px] font-normal text-slate-400">자료 보호를 위한 4자리 이상 비밀번호</span>
          </label>
          <div class="relative">
            <i data-lucide="lock" class="absolute left-3.5 top-1/2 -translate-y-1/2 h-4 w-4 text-slate-400"></i>
            <input type="password" id="form-password" required placeholder="수정 및 삭제 시 사용할 비밀번호를 입력해주세요"
              class="w-full h-11 pl-10 pr-10 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium outline-none focus:border-brand-500 focus:bg-white transition-all">
            <button type="button" onclick="togglePasswordVisibility()"
              class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 focus:outline-none">
              <i data-lucide="eye" id="pw-eye-icon" class="h-4 w-4"></i>
            </button>
          </div>
        </div>

        <!-- Form Modal Footer -->
        <div class="pt-4 border-t border-slate-100 flex items-center justify-end gap-2.5">
          <button type="button" onclick="closeFormModal()"
            class="px-5 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-sm rounded-xl transition-all">
            취소
          </button>
          <button type="submit"
            class="px-6 py-2.5 bg-brand-600 hover:bg-brand-700 text-white font-bold text-sm rounded-xl shadow-md shadow-brand-600/20 transition-all">
            저장하기
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- ==================== TOAST NOTIFICATION ==================== -->
  <div id="toast"
    class="fixed bottom-6 right-6 z-50 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none">
    <div
      class="bg-slate-900 text-white px-5 py-3 rounded-2xl shadow-2xl flex items-center gap-3 border border-slate-700">
      <div id="toast-icon"
        class="w-6 h-6 rounded-full bg-brand-500 text-white flex items-center justify-center shrink-0">
        <i data-lucide="check" class="h-3.5 w-3.5"></i>
      </div>
      <p id="toast-message" class="text-sm font-bold"></p>
    </div>
  </div>

  <!-- ==================== JAVASCRIPT LOGIC ==================== -->
  <script>
    /*************************************************************************
     * 1. DATA LAYER (Supabase 'archive' DB 연동 + LocalStorage 폴백 지원)
     *************************************************************************/

        return part;
      }
      const d = new Date(dateStr);

        const m = String(d.getMonth() + 1).padStart(2, '0');

    // 1-1. IndexedDB 헬퍼 함수 (5MB 용량 제한이 있는 LocalStorage 대체 및 대용량 첨부파일 영구 저장)
    function openIDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open('HansollMaterialDB_v1', 1);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains('materials')) {
            db.createObjectStore('materials');
          }
        };
        req.onsuccess = (e) => resolve(e.target.result);
        req.onerror = (e) => reject(e.target.error);
      });
    }

    async function idbSave(key, val) {
      try {
        const db = await openIDB();
        const tx = db.transaction('materials', 'readwrite');
        tx.objectStore('materials').put(val, key);
      } catch (e) {
        console.warn('IndexedDB save failed:', e);
      }
    }

    async function idbLoad(key) {
      try {
        const db = await openIDB();
        return new Promise((resolve) => {
          const tx = db.transaction('materials', 'readonly');
          const req = tx.objectStore('materials').get(key);
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => resolve(null);
        });
      } catch (e) {
        return null;
      }
    }

    // 1-2. Initialize Data (SWR: Local-First 0초 즉시 로딩 후 Supabase 백그라운드 자동 동기화)
    async function initData() {
      // 1단계: PC 로컬(IndexedDB -> LocalStorage -> 초기 샘플 데이터)에서 0.05초 만에 읽어와 0초 즉시 렌더링!
      let loadedLocal = false;
      try {
        const idbData = await idbLoad(STORAGE_KEY);
        if (idbData && Array.isArray(idbData) && idbData.length > 0) {
          materialsData = idbData.map(normalizeItem);
          loadedLocal = true;
        }
      } catch (e) {
        console.warn('IDB load fail:', e);
      }

      if (!loadedLocal) {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          try {
            materialsData = JSON.parse(saved).map(normalizeItem);
            loadedLocal = true;
          } catch (e) {
            console.warn('LocalStorage load fail:', e);
          }
        }
      }

      if (!loadedLocal) {
        materialsData = INITIAL_SAMPLE_DATA.map(normalizeItem);
        saveData();
      }

      // 0초 만에 기존 데이터를 즉시 화면에 출력 ("검색된 자료가 없습니다" 10초 대기 현상 완벽 해결!)
      renderAll();

      // 2단계: 백그라운드에서 조용히 클라우드(Supabase) 서버의 최신 데이터를 조회하여 자동 동기화
      if (supabaseClient) {
        try {
          const { data, error } = await supabaseClient
            .from('archive')
            .select('*')
            .order('id', { ascending: false });
          if (!error && Array.isArray(data)) {
            materialsData = data.map(normalizeItem);
            saveData(); // 로컬 캐시도 최신 클라우드 데이터로 갱신 (0건일 경우에도 빈 배열로 반영)
            renderAll(); // 신규 등록/수정/삭제된 최신 내역으로 화면 조용히 자동 갱신
          }
        } catch (err) {
          console.warn('Supabase archive 테이블 조회 실패 (로컬 데이터 유지):', err);
        }
      }
    }

    function saveData() {
      // 1. 5MB 용량 제한이 없는 IndexedDB에 모든 대용량 첨부파일과 함께 우선 저장
      idbSave(STORAGE_KEY, materialsData);
      // 2. LocalStorage는 5MB 초과 시 QuotaExceededError 발생을 방지하기 위해 try-catch 처리
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(materialsData));
      } catch (e) {
        console.warn('LocalStorage 5MB 용량 초과: 대용량 첨부파일 데이터는 IndexedDB에 정상적으로 저장되었습니다.');

    }

        // Search Keyword filter

          const kw = currentSearchKeyword.toLowerCase();
          const matchTitle = (item.title || '').toLowerCase().includes(kw);
          const matchContent = (item.content || '').toLowerCase().includes(kw);
          const matchAuthor = (item.author || '').toLowerCase().includes(kw);
          const matchDept = (item.department || '').toLowerCase().includes(kw);
          if (!matchTitle && !matchContent && !matchAuthor && !matchDept) return false;
        }
        return true;
      });
    }

    // Base64 Data URL을 Blob 객체로 변환하는 헬퍼 함수 (업로드된 실제 파일 영구 보존/열람용)
    function dataUrlToBlob(dataUrl) {
      const parts = dataUrl.split(',');
      const match = parts[0].match(/:(.*?);/);
      const mime = match ? match[1] : 'application/octet-stream';
      const bstr = atob(parts[1]);
      let n = bstr.length;
      const u8arr = new Uint8Array(n);
      while (n--) {
        u8arr[n] = bstr.charCodeAt(n);
      }
      return new Blob([u8arr], { type: mime });
    }

    async function downloadFileWithSavePicker(fileName, fileObj = null, fileUrl = null) {
      try {
        if ('showSaveFilePicker' in window) {
          const fileExtension = fileName.split('.').pop() || 'txt';
          const options = {
            suggestedName: fileName,
            types: [{
              description: 'Attachment File',
              accept: {
                '*/*': ['.' + fileExtension]
              }
            }]
          };

          const handle = await window.showSaveFilePicker(options);
          const writable = await handle.createWritable();

          let blob;
          if (fileObj instanceof Blob) {
            blob = fileObj;
          } else if (fileUrl && fileUrl.startsWith('data:')) {
            blob = dataUrlToBlob(fileUrl);
          } else if (fileUrl && fileUrl.startsWith('blob:')) {
            const res = await fetch(fileUrl);
            blob = await res.blob();
          } else {
            blob = new Blob([`Hansoll AI Gallery - Downloaded File: ${fileName}\n\nThis is a prototype attachment file download.`], { type: 'application/octet-stream' });
          }

          await writable.write(blob);
          await writable.close();

          showToast(`'${fileName}' 파일이 지정하신 위치에 저장되었습니다.`);
          return;
        }
      } catch (err) {
        if (err.name === 'AbortError') {
          return; // 사용자가 저장 창 취소
        }
        console.warn('showSaveFilePicker error or unsupported:', err);
      }

      // showSaveFilePicker 미지원 또는 예외 시 기본 다운로드 fallback
      let downloadUrl = fileUrl;
      let revokeAfter = false;
      if (!downloadUrl) {
        const blob = new Blob([`Hansoll AI Gallery - Downloaded File: ${fileName}\n\nThis is a prototype attachment file download.`], { type: 'application/octet-stream' });
        downloadUrl = URL.createObjectURL(blob);
        revokeAfter = true;
      }

      const a = document.createElement('a');
      a.href = downloadUrl;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);

      if (revokeAfter) {
        setTimeout(() => URL.revokeObjectURL(downloadUrl), 1000);
      }

      showToast(`'${fileName}' 다운로드가 완료되었습니다.`);
    }

    function openFileInNewWindow(fileName, fileUrl = '') {
      // 1. Base64 Data URL (업로드된 실제 파일 데이터)인 경우 실제 바이너리 Blob으로 변환하여 브라우저 내장 뷰어로 새 탭 열람!
      if (fileUrl && fileUrl.startsWith('data:')) {
        try {
          const blob = dataUrlToBlob(fileUrl);
          const blobUrl = URL.createObjectURL(blob);

    async function fetchLoginUserInfo() {
      const getStorage = (key) => {
        let v = sessionStorage.getItem(key);
        if (!v && window.parent && window.parent.sessionStorage) {
          try { v = window.parent.sessionStorage.getItem(key); } catch(e){}
        }
        return v;
      };

      let cdDept = getStorage('ms_cd_dept') || getStorage('cd_dept') || 'IT';
      let nmDept = getStorage('ms_department') || getStorage('nm_dept') || 'IT부';
      let empNo = getStorage('ms_emp_no') || getStorage('emp_no') || '202401';
      let empNm = getStorage('ms_displayName') || getStorage('userName') || getStorage('emp_nm') || '윤지훈';
      let occpCd = getStorage('ms_occp_grd_cd') || getStorage('occp_grd_cd') || 'M2';
      let occpNm = getStorage('ms_occp_grd_nm') || getStorage('occp_grd_nm') || '책임';

      const uid = getStorage('userNameId');
      if (supabaseClient && uid) {
        try {
          const { data: dbUser, error } = await supabaseClient
            .from('user_info')
            .select('emp_no, emp_nm, cd_dept, nm_dept, occp_grd_cd, occp_grd_nm')
            .or(`nm_email.ilike.${uid},emp_no.eq.${uid}`)
            .limit(1)
            .single();

          if (!error && dbUser) {
            if (dbUser.cd_dept) cdDept = dbUser.cd_dept;
            if (dbUser.nm_dept) nmDept = dbUser.nm_dept;
            if (dbUser.emp_no) empNo = dbUser.emp_no;
            if (dbUser.emp_nm) empNm = dbUser.emp_nm;
            if (dbUser.occp_grd_cd) occpCd = dbUser.occp_grd_cd;
            if (dbUser.occp_grd_nm) occpNm = dbUser.occp_grd_nm;

            sessionStorage.setItem('ms_cd_dept', cdDept);
            sessionStorage.setItem('ms_department', nmDept);
            sessionStorage.setItem('ms_emp_no', empNo);
            sessionStorage.setItem('ms_displayName', empNm);
            sessionStorage.setItem('ms_occp_grd_cd', occpCd);
            sessionStorage.setItem('ms_occp_grd_nm', occpNm);
          }
        } catch (err) {
          console.warn('user_info 테이블 조회 실패, 캐시/기본값 사용:', err);
        }
      }

      return { cdDept, nmDept, empNo, empNm, occpCd, occpNm };
    }

    async function openFormModal(editItemId = null) {
      const form = document.getElementById('material-form');
      form.reset();
      currentFormFiles = [];
      currentFormUrls = [];

      const modalTitle = document.getElementById('form-modal-title');
      const modalDesc = document.getElementById('form-modal-desc');
      const idInput = document.getElementById('form-item-id');

      if (editItemId) {
        // Edit Mode
        const item = materialsData.find(m => String(m.id) === String(editItemId));
        if (!item) return;

        idInput.value = item.id;
        modalTitle.textContent = '자료 수정';
        modalDesc.textContent = `'${item.title}' 자료 정보를 수정합니다.`;

        document.getElementById('form-category').value = item.category || '참고 자료';
        document.getElementById('form-cd-dept').value = item.cd_dept || 'IT';
        document.getElementById('form-department').value = item.department || 'IT부';
        document.getElementById('form-emp-no').value = item.emp_no || '202401';
        document.getElementById('form-author').value = item.author || '';
        document.getElementById('form-occp-cd').value = item.occp_grd_cd || 'M2';
        document.getElementById('form-occp-nm').value = item.occp_grd_nm || '책임';
        document.getElementById('form-title').value = item.title || '';
        document.getElementById('form-content').value = item.content || '';
        document.getElementById('form-password').value = item.password || '';

        currentFormFiles = [...(item.files || [])];
        currentFormUrls = [...(item.urls || [])];
      } else {
        // Create Mode - 로그인된 정보(부서코드, 부서명, 사번, 성명, 직급코드, 직급명)를 자동 조회하여 셋업
        idInput.value = '';
        modalTitle.textContent = '신규 자료 등록';
        modalDesc.textContent = '현재 로그인된 정보를 바탕으로 자료를 등록합니다.';

        document.getElementById('form-category').value = '참고 자료';
        document.getElementById('form-password').value = '';
        document.getElementById('form-title').value = '';
        document.getElementById('form-content').value = '';

        const loginInfo = await fetchLoginUserInfo();
        document.getElementById('form-cd-dept').value = loginInfo.cdDept;
        document.getElementById('form-department').value = loginInfo.nmDept;
        document.getElementById('form-emp-no').value = loginInfo.empNo;
        document.getElementById('form-author').value = loginInfo.empNm;
        document.getElementById('form-occp-cd').value = loginInfo.occpCd;
        document.getElementById('form-occp-nm').value = loginInfo.occpNm;

        // One empty URL row by default
        currentFormUrls = [{ title: '', url: '' }];
      }

      renderFormFilesPreview();
      renderFormUrlsList();

      const modal = document.getElementById('form-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      lucide.createIcons();
    }

    function closeFormModal(skipConfirm = false) {
      const modal = document.getElementById('form-modal');
      if (modal && !modal.classList.contains('hidden') && !skipConfirm) {
        if (!confirm("작성 중인 내용이 저장되지 않고 사라집니다.\n정말 창을 닫으시겠습니까?")) {
          return;
        }
      }
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    // 5-1. File Selection & Drag and Drop Handler
    function addFormFiles(fileList) {
      const files = Array.from(fileList);
      if (!files.length) return;

      files.forEach(file => {
        const sizeMb = (file.size / (1024 * 1024)).toFixed(1);
        const displaySize = sizeMb > 0.1 ? `${sizeMb} MB` : `${Math.max(1, Math.round(file.size / 1024))} KB`;

        const reader = new FileReader();
        reader.onload = function(e) {
          currentFormFiles.push({
            name: file.name,
            size: displaySize,
            type: file.name.split('.').pop() || 'file',
            url: e.target.result, // Base64 Data URL로 저장 (새로고침 후에도 영구 보존 및 실제 파일 새 탭 열람 가능)
            blob: file
          });
          renderFormFilesPreview();
        };
        reader.readAsDataURL(file);
      });
    }

    function handleFileSelect(e) {
      addFormFiles(e.target.files);
      e.target.value = ''; // Reset input
    }

    function resetDropZoneStyle() {
      const dropZone = document.getElementById('file-drop-zone');
      if (!dropZone) return;
      dropZone.classList.remove('border-brand-500', 'bg-brand-50/50');
      dropZone.classList.add('border-slate-200', 'bg-slate-50/50');
    }

    function handleDragEnter(e) {
      e.preventDefault();
      e.stopPropagation();
      const dropZone = document.getElementById('file-drop-zone');
      if (dropZone) {
        dropZone.classList.add('border-brand-500', 'bg-brand-50/50');
        dropZone.classList.remove('border-slate-200', 'bg-slate-50/50');
      }
    }

    function handleDragOver(e) {
      e.preventDefault();
      e.stopPropagation();
      if (e.dataTransfer) {
        e.dataTransfer.dropEffect = 'copy';
      }
      const dropZone = document.getElementById('file-drop-zone');
      if (dropZone) {
        dropZone.classList.add('border-brand-500', 'bg-brand-50/50');
        dropZone.classList.remove('border-slate-200', 'bg-slate-50/50');
      }
    }

    function handleDragLeave(e) {
      e.preventDefault();
      e.stopPropagation();
      const dropZone = document.getElementById('file-drop-zone');
      if (e.target === dropZone) {
        resetDropZoneStyle();
      }
    }

    function handleDrop(e) {
      e.preventDefault();
      e.stopPropagation();
      resetDropZoneStyle();

      const dt = e.dataTransfer;
      if (!dt || !dt.files || dt.files.length === 0) return;

      addFormFiles(dt.files);
    }

    function removeFormFile(index) {
      currentFormFiles.splice(index, 1);
      renderFormFilesPreview();
    }

    function renderFormFilesPreview() {
      const container = document.getElementById('form-files-preview');
      container.innerHTML = '';

      currentFormFiles.forEach((f, idx) => {
        const item = document.createElement('div');
        item.className = 'flex items-center justify-between p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs';
        item.innerHTML = `
          <div class="flex items-center gap-2 min-w-0">
            <i data-lucide="paperclip" class="w-4 h-4 text-brand-600 shrink-0"></i>
            <span class="font-bold text-slate-800 truncate">${f.name}</span>
            <span class="text-slate-400">(${f.size})</span>
          </div>
          <button type="button" onclick="removeFormFile(${idx})" class="text-slate-400 hover:text-rose-500 p-1">
            <i data-lucide="x" class="w-3.5 h-3.5"></i>
          </button>
        `;
        container.appendChild(item);
      });
      lucide.createIcons();
    }

    // 5-2. URL Row Management
    function addUrlInputRow() {
      currentFormUrls.push({ title: '', url: '' });
      renderFormUrlsList();
    }

    function removeUrlInputRow(index) {
      currentFormUrls.splice(index, 1);
      renderFormUrlsList();
    }

    function renderFormUrlsList() {
      const container = document.getElementById('url-inputs-container');
      container.innerHTML = '';

      currentFormUrls.forEach((u, idx) => {
        const row = document.createElement('div');
        row.className = 'flex flex-col sm:flex-row items-center gap-2 bg-slate-50/80 p-2.5 rounded-xl border border-slate-200/80';
        row.innerHTML = `
          <input type="text" placeholder="링크 이름 (예: 매뉴얼 문서)" value="${u.title || ''}"
            oninput="currentFormUrls[${idx}].title = this.value"
            class="w-full sm:w-1/3 h-9 px-3 bg-white border border-slate-200 rounded-lg text-xs outline-none focus:border-brand-500">
          
          <div class="flex items-center gap-2 w-full sm:w-2/3">
            <input type="url" placeholder="https://..." value="${u.url || ''}"
              oninput="currentFormUrls[${idx}].url = this.value"
              class="w-full h-9 px-3 bg-white border border-slate-200 rounded-lg text-xs outline-none focus:border-brand-500 font-mono">
            
            <button type="button" onclick="removeUrlInputRow(${idx})"
              class="p-2 text-slate-400 hover:text-rose-500 hover:bg-rose-50 rounded-lg transition-colors shrink-0">
              <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
          </div>
        `;
        container.appendChild(row);
      });
      lucide.createIcons();
    }

    // 5-3. Form Submit Handler (Save to LocalStorage prototype)
    function handleFormSubmit(e) {
      e.preventDefault();

      const idVal = document.getElementById('form-item-id').value;
      const category = document.getElementById('form-category').value;
      const cd_dept = document.getElementById('form-cd-dept').value.trim() || 'IT';
      const department = document.getElementById('form-department').value.trim() || 'IT부';
      const emp_no = document.getElementById('form-emp-no').value.trim() || '202401';
      const title = document.getElementById('form-title').value.trim();
      const author = document.getElementById('form-author').value.trim();
      const occp_grd_cd = document.getElementById('form-occp-cd').value.trim() || 'M2';
      const occp_grd_nm = document.getElementById('form-occp-nm').value.trim() || '책임';
      const content = document.getElementById('form-content').value.trim();
      const password = document.getElementById('form-password').value.trim();

      // Filter out empty URL rows
      const cleanUrls = currentFormUrls
        .filter(u => u.url.trim() !== '')
        .map(u => {
          let urlStr = u.url.trim();
          if (!urlStr.startsWith('http://') && !urlStr.startsWith('https://')) {
            urlStr = 'https://' + urlStr;
          }
          return {
            title: u.title.trim() || urlStr,
            url: urlStr
          };
        });

      const today = new Date().toISOString().slice(0, 10);

      if (idVal) {
        // Update Existing Item
        const idx = materialsData.findIndex(m => String(m.id) === String(idVal));
        if (idx !== -1) {
          materialsData[idx] = normalizeItem({
            ...materialsData[idx],
            category,
            cd_dept,
            nm_dept: department,
            emp_no,
            emp_nm: author,
            occp_grd_cd,
            occp_grd_nm,
            title,
            contents: content,
            password,
            files: [...currentFormFiles],
            links: cleanUrls,
            updated_at: new Date().toISOString().slice(0, 10)
          });
          showToast('자료 수정이 완료되었습니다.');

          if (supabaseClient && !isNaN(Number(idVal))) {
            const targetId = Number(idVal);
            supabaseClient.from('archive').update(toDbRow(materialsData[idx])).eq('id', targetId).then(({ error }) => {
              if (error) console.warn('Supabase update fail:', error);
            });
          }
        }
      } else {
        // Create New Item
        const newItem = normalizeItem({
          id: 'mat-' + (Date.now() % 100000),
          cd_dept,
          nm_dept: department,
          emp_no,
          emp_nm: author,
          occp_grd_cd,
          occp_grd_nm,
          category,
          title,
          contents: content,
          password,
          created_at: today,
          files: [...currentFormFiles],
          links: cleanUrls
        });
        materialsData.unshift(newItem); // Add to top
        showToast('신규 자료가 등록되었습니다.');

        if (supabaseClient) {
          supabaseClient.from('archive').insert(toDbRow(newItem)).then(({ error }) => {
            if (error) console.warn('Supabase insert fail:', error);
          });
        }
      }

      saveData();
      closeFormModal(true);
      renderAll();
    }

    /*************************************************************************
     * 6. TOAST NOTIFICATION UTILITY
     *************************************************************************/
    let toastTimeout = null;
    function showToast(message) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-message').textContent = message;

      if (toastTimeout) clearTimeout(toastTimeout);

      toast.classList.remove('translate-y-20', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');

      toastTimeout = setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 3000);
    }

    /*************************************************************************
     * 7. INITIALIZE PAGE
     *************************************************************************/
    document.addEventListener('DOMContentLoaded', () => {
      initData();

      // ESC 키로 팝업/모달 창 닫기 지원 (신규/수정 자료 등록 모달, 상세 내용 조회 창)
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' || e.keyCode === 27) {
          const formModal = document.getElementById('form-modal');
          if (formModal && !formModal.classList.contains('hidden')) {
            closeFormModal(); // 닫기 전 데이터 소실 경고 알림 표시
            return;
          }
          const detailModal = document.getElementById('detail-modal');
          if (detailModal && !detailModal.classList.contains('hidden')) {
            closeDetailModal();
            return;
          }
        }
      });

      // 브라우저 기본 드래그 앤 드롭 동작 차단 (영역 밖으로 드롭 시 파일이 브라우저 탭에서 새 창으로 열리는 현상 방지)
      window.addEventListener('dragover', (e) => e.preventDefault(), false);
      window.addEventListener('drop', (e) => e.preventDefault(), false);
    });
  </script>
